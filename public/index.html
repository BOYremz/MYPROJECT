<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmap Clone - Order Flow Visualization</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --bg-panel: #1c1c3a;
      --border-color: #2a2a4a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --text-muted: #606080;
      --accent-blue: #4fc3f7;
      --accent-green: #66bb6a;
      --accent-red: #ef5350;
      --accent-yellow: #ffd54f;
      --accent-orange: #ff9800;
      --bid-color: #1b5e20;
      --ask-color: #b71c1c;
      --bid-text: #4caf50;
      --ask-text: #f44336;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ===== TOP TOOLBAR ===== */
    #toolbar {
      display: flex;
      align-items: center;
      height: 36px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0 12px;
      gap: 16px;
      font-size: 12px;
    }

    .toolbar-brand {
      font-weight: bold;
      font-size: 14px;
      color: var(--accent-blue);
      letter-spacing: 1px;
    }

    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border-color);
    }

    .toolbar-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
    }

    .toolbar-item .value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .toolbar-item.positive .value { color: var(--accent-green); }
    .toolbar-item.negative .value { color: var(--accent-red); }

    .instrument-btn {
      padding: 3px 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      font-family: inherit;
    }
    .instrument-btn:hover { background: var(--border-color); color: var(--text-primary); }
    .instrument-btn.active { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); font-weight: bold; }

    .order-btn {
      padding: 3px 10px;
      border: none;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      font-family: inherit;
      font-weight: bold;
    }
    .order-btn.buy { background: var(--accent-green); color: #000; }
    .order-btn.sell { background: var(--accent-red); color: #fff; }
    .order-btn:hover { opacity: 0.85; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== MAIN LAYOUT ===== */
    #main-container {
      display: flex;
      height: calc(100vh - 36px);
    }

    /* ===== VOLUME PROFILE (LEFT) ===== */
    #volume-profile {
      width: 80px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    #volume-profile canvas {
      width: 100%;
      height: 100%;
    }

    /* ===== HEATMAP (CENTER) ===== */
    #heatmap-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    #heatmap-canvas {
      display: block;
    }

    #crosshair-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .crosshair-label {
      position: absolute;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      pointer-events: none;
      display: none;
      font-family: monospace;
    }

    #price-label {
      right: 0;
      transform: translateY(-50%);
    }

    #time-label {
      bottom: 0;
      transform: translateX(-50%);
    }

    /* ===== PRICE AXIS (RIGHT of heatmap) ===== */
    #price-axis {
      width: 65px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    #price-axis canvas {
      width: 100%;
      height: 100%;
    }

    /* ===== DOM LADDER (RIGHT) ===== */
    #dom-panel {
      width: 220px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    #dom-header {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-secondary);
    }

    #dom-ladder {
      flex: 1;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    #dom-ladder table {
      width: 100%;
      border-collapse: collapse;
    }

    #dom-ladder tr {
      height: 18px;
      border-bottom: 1px solid rgba(42, 42, 74, 0.3);
    }

    #dom-ladder td {
      padding: 0 4px;
      text-align: right;
      white-space: nowrap;
      position: relative;
    }

    #dom-ladder .bid-row {
      background: rgba(27, 94, 32, 0.15);
    }

    #dom-ladder .ask-row {
      background: rgba(183, 28, 28, 0.15);
    }

    #dom-ladder .spread-row {
      background: rgba(79, 195, 247, 0.1);
      text-align: center;
      color: var(--accent-blue);
      font-size: 10px;
    }

    #dom-ladder .price-cell {
      color: var(--text-primary);
      font-weight: 500;
      width: 60px;
    }

    #dom-ladder .qty-cell {
      width: 50px;
    }

    #dom-ladder .bid-qty { color: var(--bid-text); }
    #dom-ladder .ask-qty { color: var(--ask-text); }

    #dom-ladder .bar-bg {
      position: absolute;
      top: 0;
      height: 100%;
      opacity: 0.2;
    }

    #dom-ladder .bid-bar { background: var(--accent-green); right: 0; }
    #dom-ladder .ask-bar { background: var(--accent-red); left: 0; }

    #dom-ladder .vol-cell {
      color: var(--text-muted);
      font-size: 10px;
      width: 45px;
    }

    /* ===== CVD / INDICATORS PANEL (BOTTOM) ===== */
    #bottom-panel {
      position: absolute;
      bottom: 0;
      left: 80px;
      right: 285px;
      height: 80px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
    }

    #cvd-canvas {
      width: 100%;
      height: 100%;
    }

    /* ===== INFO OVERLAY ===== */
    #info-overlay {
      position: absolute;
      top: 44px;
      left: 92px;
      font-size: 11px;
      color: var(--text-secondary);
      pointer-events: none;
      z-index: 10;
    }

    #info-overlay .info-row {
      margin-bottom: 2px;
    }

    /* ===== CONNECTION STATUS ===== */
    #connection-status {
      position: absolute;
      top: 44px;
      right: 290px;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 3px;
      z-index: 10;
    }

    .connected { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
    .disconnected { background: rgba(244, 67, 54, 0.2); color: var(--accent-red); }

    /* ===== ZOOM CONTROLS ===== */
    #zoom-controls {
      position: absolute;
      bottom: 90px;
      right: 290px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }

    .zoom-btn:hover {
      background: var(--bg-tertiary);
    }
  </style>
</head>
<body>
  <!-- TOOLBAR -->
  <div id="toolbar">
    <span class="toolbar-brand">BOOKMAP</span>
    <div class="toolbar-sep"></div>
    <div id="instrument-buttons" style="display:flex;gap:3px;">
      <button class="instrument-btn active" data-symbol="XAUUSD">XAU</button>
      <button class="instrument-btn" data-symbol="BTCUSD">BTC</button>
      <button class="instrument-btn" data-symbol="ETHUSD">ETH</button>
      <button class="instrument-btn" data-symbol="SOLUSD">SOL</button>
      <button class="instrument-btn" data-symbol="BNBUSD">BNB</button>
      <button class="instrument-btn" data-symbol="XRPUSD">XRP</button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-item">
      <span>Last:</span>
      <span class="value" id="tb-last">--</span>
    </div>
    <div class="toolbar-item" id="tb-change-container">
      <span>Chg:</span>
      <span class="value" id="tb-change">--</span>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-item">
      <span>Bid:</span>
      <span class="value" style="color:var(--bid-text)" id="tb-bid">--</span>
    </div>
    <div class="toolbar-item">
      <span>Ask:</span>
      <span class="value" style="color:var(--ask-text)" id="tb-ask">--</span>
    </div>
    <div class="toolbar-item">
      <span>Sprd:</span>
      <span class="value" id="tb-spread">--</span>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-item">
      <span>Vol:</span>
      <span class="value" id="tb-volume">0</span>
    </div>
    <div class="toolbar-item">
      <span>Hi:</span>
      <span class="value" style="color:var(--accent-green)" id="tb-high">--</span>
    </div>
    <div class="toolbar-item">
      <span>Lo:</span>
      <span class="value" style="color:var(--accent-red)" id="tb-low">--</span>
    </div>
    <div class="toolbar-sep"></div>
    <button class="order-btn buy" id="btn-buy">BUY</button>
    <button class="order-btn sell" id="btn-sell">SELL</button>
    <div class="toolbar-sep"></div>
    <div class="toolbar-item">
      <div class="status-dot"></div>
      <span id="tb-status">Live</span>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-container">
    <!-- Volume Profile -->
    <div id="volume-profile">
      <canvas id="vp-canvas"></canvas>
    </div>

    <!-- Heatmap -->
    <div id="heatmap-container">
      <canvas id="heatmap-canvas"></canvas>
      <div id="crosshair-overlay">
        <div class="crosshair-label" id="price-label"></div>
        <div class="crosshair-label" id="time-label"></div>
      </div>
      <div id="bottom-panel">
        <canvas id="cvd-canvas"></canvas>
      </div>
    </div>

    <!-- Price Axis -->
    <div id="price-axis">
      <canvas id="price-canvas"></canvas>
    </div>

    <!-- DOM Ladder -->
    <div id="dom-panel">
      <div id="dom-header">
        <span>BID QTY</span>
        <span>PRICE</span>
        <span>ASK QTY</span>
      </div>
      <div id="dom-ladder"></div>
    </div>
  </div>

  <!-- Overlays -->
  <div id="connection-status" class="disconnected">Connecting...</div>
  <div id="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">−</button>
    <button class="zoom-btn" id="zoom-reset">⟲</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
