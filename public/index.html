<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Free Bookmap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Consolas', monospace; overflow: hidden; height: 100vh; }
    
    #topBar { display: flex; align-items: center; padding: 6px 12px; background: #161b22; border-bottom: 1px solid #30363d; height: 42px; gap: 10px; }
    .logo { font-size: 13px; font-weight: bold; color: #00d4ff; letter-spacing: 1px; }
    .group { display: flex; gap: 3px; }
    .btn { padding: 4px 10px; background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit; }
    .btn:hover { background: #30363d; color: #fff; }
    .btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn.tf.active { background: #d29922; border-color: #d29922; color: #000; }
    .sep { width: 1px; height: 22px; background: #30363d; }
    .price-area { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .countdown { font-size: 11px; color: #d29922; background: rgba(210,153,34,0.15); padding: 3px 10px; border-radius: 3px; border: 1px solid rgba(210,153,34,0.3); }
    .price-val { font-size: 18px; font-weight: bold; min-width: 100px; text-align: right; }
    
    #main { display: grid; grid-template-columns: 1fr 250px; height: calc(100vh - 42px - 22px); }
    #chartArea { position: relative; overflow: hidden; }
    #chartCanvas { display: block; cursor: crosshair; }
    
    #right { background: #0d1117; border-left: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; font-size: 10px; }
    .sect { padding: 8px 10px; border-bottom: 1px solid #21262d; }
    .sect-title { font-size: 9px; color: #00d4ff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; font-weight: bold; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .stat { display: flex; justify-content: space-between; }
    .stat-l { color: #6e7681; }
    .stat-v { font-weight: bold; }
    .green { color: #3fb950; }
    .red { color: #f85149; }
    
    #dom { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .dom-row { display: grid; grid-template-columns: 60px 1fr 60px; height: 17px; align-items: center; position: relative; font-size: 10px; }
    .dom-bid { text-align: right; color: #3fb950; padding-right: 5px; z-index: 1; }
    .dom-ask { text-align: left; color: #f85149; padding-left: 5px; z-index: 1; }
    .dom-price { text-align: center; color: #c9d1d9; z-index: 1; font-weight: bold; }
    .dom-bar-bid { position: absolute; right: 50%; height: 15px; background: rgba(63,185,80,0.18); border-right: 1px solid rgba(63,185,80,0.4); }
    .dom-bar-ask { position: absolute; left: 50%; height: 15px; background: rgba(248,81,73,0.18); border-left: 1px solid rgba(248,81,73,0.4); }
    .spread-row { background: rgba(210,153,34,0.08); }
    
    #events { height: 160px; overflow-y: auto; padding: 4px 8px; }
    .ev { padding: 2px 5px; margin-bottom: 1px; border-left: 2px solid #30363d; background: #161b22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; }
    .ev.buy { border-left-color: #3fb950; color: #3fb950; }
    .ev.sell { border-left-color: #f85149; color: #f85149; }
    .ev.pull { border-left-color: #d29922; color: #d29922; }
    .ev.stack { border-left-color: #a371f7; color: #a371f7; }
    
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; font-size: 9px; }
    .leg { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 4px; border-radius: 1px; }
    
    #bottom { height: 22px; background: #161b22; border-top: 1px solid #30363d; display: flex; align-items: center; padding: 0 12px; font-size: 10px; color: #6e7681; gap: 16px; }
    .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: #f85149; display: inline-block; margin-right: 5px; }
    .conn-dot.on { background: #3fb950; }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="topBar">
    <div class="logo">BOOKMAP</div>
    <div class="group" id="instBtns"></div>
    <div class="sep"></div>
    <div class="group" id="tfBtns"></div>
    <div class="sep"></div>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="zoomOut">−</button>
    <button class="btn" id="zoomReset">↺</button>
    <div class="price-area">
      <div class="countdown" id="countdown">--:--</div>
      <div class="price-val" id="priceVal">--</div>
    </div>
  </div>
  
  <div id="main">
    <div id="chartArea">
      <canvas id="chartCanvas"></canvas>
    </div>
    <div id="right">
      <div class="sect">
        <div class="sect-title">Stats</div>
        <div class="stats">
          <div class="stat"><span class="stat-l">Bid Vol</span><span class="stat-v green" id="sBid">0</span></div>
          <div class="stat"><span class="stat-l">Ask Vol</span><span class="stat-v red" id="sAsk">0</span></div>
          <div class="stat"><span class="stat-l">Buy</span><span class="stat-v green" id="sBuy">0</span></div>
          <div class="stat"><span class="stat-l">Sell</span><span class="stat-v red" id="sSell">0</span></div>
          <div class="stat"><span class="stat-l">Spread</span><span class="stat-v" id="sSpread">0</span></div>
          <div class="stat"><span class="stat-l">Imbal</span><span class="stat-v" id="sImbal">0%</span></div>
        </div>
      </div>
      <div class="sect" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div class="sect-title">DOM</div>
        <div id="dom"></div>
      </div>
      <div class="sect" style="height:180px">
        <div class="sect-title">Events</div>
        <div id="events"></div>
      </div>
      <div class="sect">
        <div class="sect-title">Legend</div>
        <div class="legend">
          <div class="leg"><div class="dot" style="background:#ff8800"></div>Hi liquidity</div>
          <div class="leg"><div class="dot" style="background:#ff0000"></div>Med liquidity</div>
          <div class="leg"><div class="dot" style="background:#0088ff"></div>Lo liquidity</div>
          <div class="leg"><div class="dot" style="background:#ffaa00;border-radius:50%"></div>Price line</div>
          <div class="leg"><div class="dot" style="background:#3fb950;border-radius:50%"></div>Buy trade</div>
          <div class="leg"><div class="dot" style="background:#f85149;border-radius:50%"></div>Sell trade</div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="bottom">
    <span><span class="conn-dot" id="connDot"></span><span id="connText">Connecting</span></span>
    <span id="sInst">--</span>
    <span id="sTf">1m</span>
    <span id="sInfo">Loading...</span>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
