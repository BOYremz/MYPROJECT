<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Bookmap - Live Trading Heatmap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }

    #topBar { display: flex; align-items: center; padding: 5px 10px; background: #111118; border-bottom: 1px solid #2a2a3a; height: 40px; gap: 10px; }
    .logo { font-size: 12px; font-weight: bold; color: #00e5ff; letter-spacing: 1px; }
    .btn-group { display: flex; gap: 3px; }
    .btn { padding: 3px 9px; background: #1a1a2e; border: 1px solid #333; color: #888; border-radius: 3px; cursor: pointer; font-size: 10px; font-family: inherit; transition: all 0.15s; }
    .btn:hover { border-color: #00e5ff; color: #fff; }
    .btn.active { background: #00344a; border-color: #00e5ff; color: #00e5ff; }
    .btn.tf { border-color: #444; }
    .btn.tf.active { background: #3a2a00; border-color: #ffaa00; color: #ffaa00; }
    .sep { width: 1px; height: 20px; background: #333; margin: 0 4px; }
    .price-area { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .countdown { font-size: 10px; color: #ffaa00; background: #1a1500; padding: 2px 8px; border-radius: 3px; border: 1px solid #4a3500; }
    .price-val { font-size: 16px; font-weight: bold; }

    #main { display: grid; grid-template-columns: 1fr 240px; height: calc(100vh - 40px - 18px); }
    #chartArea { position: relative; overflow: hidden; }
    #chartCanvas { display: block; width: 100%; height: 100%; }

    #rightPanel { background: #0d0d15; border-left: 1px solid #1a1a2e; display: flex; flex-direction: column; overflow: hidden; font-size: 9px; }
    .section { padding: 6px 8px; border-bottom: 1px solid #1a1a2e; }
    .section-title { font-size: 9px; color: #00e5ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: bold; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .stat { display: flex; justify-content: space-between; }
    .stat-l { color: #555; }
    .stat-v { font-weight: bold; }
    .green { color: #26a69a; }
    .red { color: #ef5350; }

    #domLadder { flex: 1; overflow-y: auto; padding: 4px; }
    .dom-row { display: grid; grid-template-columns: 60px 1fr 60px; height: 16px; align-items: center; position: relative; }
    .dom-bid { text-align: right; color: #26a69a; padding-right: 4px; z-index: 1; }
    .dom-ask { text-align: left; color: #ef5350; padding-left: 4px; z-index: 1; }
    .dom-price { text-align: center; color: #aaa; z-index: 1; font-weight: bold; }
    .dom-bar-bid { position: absolute; right: 50%; height: 14px; background: rgba(38,166,154,0.15); border-right: 1px solid rgba(38,166,154,0.4); }
    .dom-bar-ask { position: absolute; left: 50%; height: 14px; background: rgba(239,83,80,0.15); border-left: 1px solid rgba(239,83,80,0.4); }

    #eventsLog { height: 160px; overflow-y: auto; padding: 4px; }
    .ev { padding: 1px 4px; margin-bottom: 1px; border-left: 2px solid #333; background: #0f0f18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev.buy { border-left-color: #00e676; color: #00e676; }
    .ev.sell { border-left-color: #ff1744; color: #ff1744; }
    .ev.pull { border-left-color: #ffab00; color: #ffab00; }
    .ev.stack { border-left-color: #7c4dff; color: #7c4dff; }
    .ev.ice { border-left-color: #00e5ff; color: #00e5ff; }

    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .leg { display: flex; align-items: center; gap: 3px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }

    #statusBar { height: 18px; background: #111118; border-top: 1px solid #222; display: flex; align-items: center; padding: 0 10px; font-size: 9px; color: #444; gap: 14px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3547; display: inline-block; margin-right: 3px; }
    .status-dot.on { background: #00e676; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="topBar">
    <div class="logo">BOOKMAP</div>
    <div class="btn-group" id="instBtns"></div>
    <div class="sep"></div>
    <div class="btn-group" id="tfBtns"></div>
    <div class="sep"></div>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="zoomOut">-</button>
    <button class="btn" id="zoomReset">R</button>
    <div class="price-area">
      <div class="countdown" id="countdown">--:--</div>
      <div class="price-val" id="priceVal">--</div>
    </div>
  </div>

  <div id="main">
    <div id="chartArea"><canvas id="chartCanvas"></canvas></div>
    <div id="rightPanel">
      <div class="section">
        <div class="section-title">Stats</div>
        <div class="stats">
          <div class="stat"><span class="stat-l">Bid</span><span class="stat-v green" id="sBid">0</span></div>
          <div class="stat"><span class="stat-l">Ask</span><span class="stat-v red" id="sAsk">0</span></div>
          <div class="stat"><span class="stat-l">BuyPwr</span><span class="stat-v green" id="sBuy">0</span></div>
          <div class="stat"><span class="stat-l">SellPwr</span><span class="stat-v red" id="sSell">0</span></div>
          <div class="stat"><span class="stat-l">Spread</span><span class="stat-v" id="sSpread">0</span></div>
          <div class="stat"><span class="stat-l">Imbal</span><span class="stat-v" id="sImbal">0%</span></div>
        </div>
      </div>
      <div class="section" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
        <div class="section-title">DOM</div>
        <div id="domLadder"></div>
      </div>
      <div class="section" style="height:180px">
        <div class="section-title">Events</div>
        <div id="eventsLog"></div>
      </div>
      <div class="section">
        <div class="section-title">Legend</div>
        <div class="legend">
          <div class="leg"><div class="dot" style="background:#26a69a"></div>Buy dot</div>
          <div class="leg"><div class="dot" style="background:#ef5350"></div>Sell dot</div>
          <div class="leg"><div class="dot" style="background:#00c853"></div>Bid liq</div>
          <div class="leg"><div class="dot" style="background:#ff3547"></div>Ask liq</div>
          <div class="leg"><div class="dot" style="background:#ffaa00"></div>Price</div>
          <div class="leg"><div class="dot" style="background:#7c4dff"></div>Stack</div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusBar">
    <span><span class="status-dot" id="sDot"></span><span id="sConn">Connecting</span></span>
    <span id="sInst">--</span>
    <span id="sTf">1m</span>
    <span id="sInfo">Loading...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
